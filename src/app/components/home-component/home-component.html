<div class="container">
  <h1 class="text-light text-center mb-4">Personajes de Pixar</h1>

  <div class="row g-4">
    @for (pixar of pixars; track $index) {
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card bg-dark text-light h-100 border-secondary">
          <img
            [src]="pixar.imagen"
            [alt]="pixar.nombre"
            class="card-img-top"
            style="height: 250px; object-fit: cover"
          />

          <div class="card-body">
            <h5 class="card-title">{{ pixar.nombre }}</h5>

            <p class="card-text text-secondary">Película: {{ pixar.pelicula }}</p>

            <button class="btn btn-danger w-100" (click)="deletePixarAsync(pixar.idPersonaje)">
              <i class="bi bi-trash"></i> Borrar personaje
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
